# Run the full lab experiment suite in CI and commit the results back.
#
# Why this exists: the lab's real-model mode (R1-R3 against
# Qwen2.5-0.5B-Instruct) needs torch + transformers, which not every
# machine has. GitHub-hosted runners do the job for free: CPU-only torch
# from the PyTorch CPU wheel index (the default PyPI wheel bundles
# multi-GB CUDA libraries this lab never uses), then one shared sampling
# pass whose generations R1, R2 and R3 all measure.
#
# Trigger: manual only (Actions tab -> "Run experiments" -> Run workflow).
# The results commit lands on main with [skip ci] and is authored by the
# github-actions bot; it is the provenance record for the numbers quoted
# in the companion article.

name: Run experiments

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: run-experiments
  cancel-in-progress: false

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only torch and transformers
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install transformers==4.48.3

      - name: Run the full default suite (8 tasks, toy/symbolic engines)
        run: python3 run_all.py

      - name: Run the real-model pass for R1-R3 (shared sampling)
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          # Force fresh generations in CI even if a cache was committed:
          # a dispatched run must be a real run, not a cache replay.
          rm -f results/llm_generations.json
          python3 src/r1_direct_vs_cot.py --llm
          python3 src/r2_self_consistency.py --llm
          python3 src/r3_verifier.py --llm

      - name: Regenerate the default suite summary (records the LLM run)
        run: python3 run_all.py

      - name: Validate the repo
        run: python3 validate.py

      - name: Commit results back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Experiment run ${{ github.run_id }}: full suite + real-model R1-R3 results [skip ci]"
            git push
          fi
